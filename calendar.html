<!-- CALENDAR -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar - Dialogue Student Association</title>

  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="icon" type="image/png" href="logo.png" sizes="96x96">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <link rel="manifest" href="site.webmanifest">

</head>
<body>
  <header class="site-header">
    <div class="logo">
      <a href="index.html" aria-label="Dialogue Student Association home">
        <img src="logo_without_labels.png" alt="Dialogue Student Association">
      </a>
    </div>

    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" id="primary-navigation" aria-label="Primary navigation">
      <ul class="nav-links">
        <li><a href="about.html">About Us</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a class="donate-link" href="donate.html">Donate</a></li>
      </ul>
    </nav>
  </header>

  <!-- Wrapped in scroll container -->
  <div class="scroll-container">
    <div class="calendar-container">
      <div class="calendar-header">
        <button id="prevMonth" class="month-nav">&lt;</button>
        <h2 id="monthYear"></h2>
        <button id="nextMonth" class="month-nav">&gt;</button>
      </div>
      <div class="calendar" id="calendar"></div>
    </div>

    <div class="event-popup" id="eventPopup">
      <button class="close-btn" id="closePopup">×</button>
      <div class="event-details" id="eventDetails"></div>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
